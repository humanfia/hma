name: Offline reproduction checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-repro.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m hma.repro.cli doctor --config configs/local.json --offline
      - run: python -m hma.repro.cli plan --suite paper
      - run: python -m pip install build ruff
      - run: ruff check src/hma tests
      - run: ruff format --check src/hma tests
      - run: python -m build --wheel
